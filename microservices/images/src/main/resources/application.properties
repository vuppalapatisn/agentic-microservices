spring.application.name=images
server.servlet.context-path=/image-service
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:imagesdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
#spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
# Default (tests / local) runs schema-h2.sql + data-h2.sql. Runtime overrides this to
# postgresql via the ConfigMap so schema-postgresql.sql + data-postgresql.sql run instead.
spring.sql.init.platform=h2
spring.jpa.defer-datasource-initialization=true
spring.jmx.enabled=false
useImages=true
server.port=8090
management.endpoints.enabled-by-default=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoints.web.base-path=/actuator
management.endpoints.access.default=unrestricted
management.endpoint.prometheus.enabled=true
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true
management.endpoint.health.probes.enabled=true
# HTTP latency histograms — enable P90/P95/P99 via histogram_quantile() in Prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=5ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
management.security.enabled=false
