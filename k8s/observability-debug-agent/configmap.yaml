apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-debug-agent-config
  namespace: observability
data:
  # Using Google Gemini via its OpenAI-compatible endpoint. The API key (a Google AI
  # Studio key) is supplied by the observability-debug-agent-secret Secret. Set
  # OPENAI_BASE_URL to "" and OPENAI_MODEL to an OpenAI model to switch back to OpenAI.
  OPENAI_MODEL: "gemini-2.0-flash"
  OPENAI_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai/"
  OBSERVABILITY_AGENT_BASE_URL: "http://observability-server.observability.svc.cluster.local:8091"
  REQUEST_TIMEOUT_SECONDS: "10"
  STARTUP_VALIDATION_RETRIES: "30"
  STARTUP_VALIDATION_RETRY_SECONDS: "2"
  GRAFANA_BASE_URL: "http://localhost:3000"
  GRAFANA_API_BASE_URL: "http://grafana.observability.svc.cluster.local:3000"
  GRAFANA_LOKI_DATASOURCE_UID: "loki"
  GRAFANA_DASHBOARD_UID: "ecommerce-observability"
  LANGGRAPH_DEBUG: "true"
