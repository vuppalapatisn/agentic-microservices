apiVersion: v1
kind: ConfigMap
metadata:
  name: images-config
  namespace: ecommerce
data:
  SERVER_PORT: "8090"
  SERVER_SERVLET_CONTEXT_PATH: "/image-service"
  # Postgres datasource (password comes from the postgres-secret Secret, not this ConfigMap).
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/imagesdb"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
  SPRING_DATASOURCE_USERNAME: "ecommerce"
  SPRING_JPA_DATABASE_PLATFORM: "org.hibernate.dialect.PostgreSQLDialect"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
  SPRING_SQL_INIT_MODE: "always"
  SPRING_SQL_INIT_PLATFORM: "postgresql"
  SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
  USE_IMAGES: "true"
  MANAGEMENT_SECURITY_ENABLED: "false"
  MANAGEMENT_ENDPOINTS_ENABLED_BY_DEFAULT: "true"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
  MANAGEMENT_ENDPOINTS_WEB_BASE_PATH: "/actuator"
  MANAGEMENT_ENDPOINTS_ACCESS_DEFAULT: "unrestricted"
  MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
  MANAGEMENT_ENDPOINT_PROMETHEUS_ACCESS: "unrestricted"
  MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: "true"
  MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED: "true"
  MANAGEMENT_HEALTH_READINESSSTATE_ENABLED: "true"
  MANAGEMENT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
