apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: observability-ingress
  namespace: observability
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Strip the /observability prefix before forwarding to the agent
    # (e.g. /observability/api/v1/investigate -> /api/v1/investigate).
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: public-iks-k8s-nginx
  # Host-less: served on the cluster's Ingress Subdomain (see ecommerce ingress note).
  rules:
    - http:
        paths:
          # NOTE: this exposes the agent's REST API (e.g. /observability/api/v1/investigate
          # and /observability/health). The React chat UI assumes a root base path, so its
          # static assets are best accessed via `kubectl port-forward svc/observability-debug-agent 8092:8092`.
          - path: /observability(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: observability-debug-agent
                port:
                  number: 8092
