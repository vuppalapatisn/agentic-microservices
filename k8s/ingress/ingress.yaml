apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  namespace: ecommerce
  annotations:
    # IBM Cloud IKS managed nginx ALB. HTTP (no TLS) for quick testing.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  # IKS public ALB. Use "private-iks-k8s-nginx" for a private ALB.
  ingressClassName: public-iks-k8s-nginx
  # Host-less: the ALB serves these paths on the cluster's Ingress Subdomain.
  # Get it with:  ibmcloud ks cluster get --cluster <id> | grep "Ingress Subdomain"
  # To pin a host instead, add `host: <ingress-subdomain>` under the rule.
  rules:
    - http:
        paths:
          # Each service already has its own context-path, so no rewrite is needed.
          - path: /ecommerce-service
            pathType: Prefix
            backend:
              service:
                name: ecommerce-service
                port:
                  number: 8090
          - path: /product-service
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 8090
          - path: /image-service
            pathType: Prefix
            backend:
              service:
                name: images-service
                port:
                  number: 8090
