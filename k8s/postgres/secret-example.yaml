# TEMPLATE ONLY — do not commit a real password.
#
# The product and images services and the Postgres server all read the password from
# this Secret (key POSTGRES_PASSWORD). Create it once (it survives start.bat):
#
#   kubectl create secret generic postgres-secret \
#     --from-literal=POSTGRES_PASSWORD=change-me-strong-password \
#     -n ecommerce
#
# Or apply a copy of this file with a real value filled in (kept out of git).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: ecommerce
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"
