# Apply once per namespace before deploying (only needed if not already
# created automatically by deploy-ibm-cloud-icr.sh / the ibm_cloud_icr_build
# GitHub Actions workflow, which create/update this secret for you when an
# API key is available):
#
#   kubectl create secret docker-registry in-icr-io-secret \
#     --docker-server=in.icr.io \
#     --docker-username=iamapikey \
#     --docker-password=<IBM_CLOUD_API_KEY> \
#     --namespace=ecommerce
#
#   kubectl create secret docker-registry in-icr-io-secret \
#     --docker-server=in.icr.io \
#     --docker-username=iamapikey \
#     --docker-password=<IBM_CLOUD_API_KEY> \
#     --namespace=observability
#
# Why this is needed: IBM Cloud Kubernetes Service auto-provisions image
# pull secrets (all-icr-io, default-icr-io, etc.) covering the common
# Container Registry regions, but this did not include in.icr.io (the
# in-che / Chennai region) at the time this was written - pods had zero
# credentials to pull with at all, failing with a 401 on an anonymous pull
# attempt. Verify with `kubectl get secrets -n <namespace>` whether this is
# still necessary for your account/region.
#
# The YAML below is a placeholder - replace <BASE64_DOCKERCONFIG_JSON>
# with the output of:
#   cat ~/.docker/config.json | base64 -w 0
---
apiVersion: v1
kind: Secret
metadata:
  name: in-icr-io-secret
  namespace: ecommerce
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <BASE64_DOCKERCONFIG_JSON>
---
apiVersion: v1
kind: Secret
metadata:
  name: in-icr-io-secret
  namespace: observability
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <BASE64_DOCKERCONFIG_JSON>
