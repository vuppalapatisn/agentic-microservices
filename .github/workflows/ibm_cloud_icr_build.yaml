name: IBM Cloud (ICR) - Build, Push & Deploy

# ---------------------------------------------------------------------------
# Same end result as deploy-ibm-cloud-icr.sh, run in CI: builds each service,
# pushes it to IBM Cloud Container Registry (in.icr.io/agentic/<service>:latest)
# instead of Docker Hub, then applies the k8s manifests and rolls out the
# new image on the IBM Cloud Kubernetes Service (IKS) cluster.
#
# Why ICR instead of Docker Hub: ICR sits on IBM's own network, so IKS
# worker nodes can reach it without needing outbound internet access (no
# VPC Public Gateway dependency, unlike pulling from docker.io). IKS
# clusters also get automatic image-pull access to ICR namespaces in the
# same IBM Cloud account, with no manual imagePullSecret required.
#
# Every app-facing Service (product, images, ecommerce,
# observability-debug-agent) is type LoadBalancer, so the application is
# reachable on a public IP/hostname directly once the rollout finishes -
# see the "Services" section of the job summary for the EXTERNAL-IP.
#
# Required repository secret (Settings -> Secrets and variables -> Actions):
#   IBM_CLOUD_API_KEY   IBM Cloud IAM API key with access to the target
#                        cluster AND to Container Registry (used for both
#                        `ibmcloud login` and `ibmcloud cr login`)
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - IBMcloud
    paths:
      - "microservices/**"
      - "k8s/namespace.yaml"
      - "k8s/observability/namespace.yaml"
      - ".github/workflows/ibm_cloud_icr_build.yaml"
  workflow_dispatch: {}

env:
  ICR_REGISTRY: in.icr.io
  ICR_REGION: in-che
  ICR_NAMESPACE: agentic
  IMAGE_TAG: latest
  IKS_CLUSTER_ID: d93v66vh0iiqv4s5rms0
  # Chennai, India. Verify with `ibmcloud regions` if the cluster ever moves.
  IBM_CLOUD_REGION: in-che

jobs:
  build-push-deploy:
    name: Build, push images to ICR & deploy to IBM Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Install IBM Cloud CLI
        run: |
          curl -fsSL https://clis.cloud.ibm.com/install/linux | sh
          ibmcloud plugin install kubernetes-service -f
          ibmcloud plugin install container-registry -f

      - name: Log in to IBM Cloud
        run: ibmcloud login --apikey "${{ secrets.IBM_CLOUD_API_KEY }}" -r "${{ env.IBM_CLOUD_REGION }}"

      - name: Set Container Registry region
        # This account's registry namespace lives under the in-che region,
        # whose registry hostname is in.icr.io (not the global icr.io).
        # Verify with `ibmcloud cr region-set --list` if the account changes.
        run: ibmcloud cr region-set ${{ env.ICR_REGION }}

      - name: Log in to IBM Cloud Container Registry
        # Log Docker in directly against the exact hostname we push to,
        # rather than relying on `ibmcloud cr login`'s region resolution -
        # Docker's credential store is keyed by exact hostname, so any
        # mismatch here would silently fail later as "unauthorized" on push.
        run: echo "${{ secrets.IBM_CLOUD_API_KEY }}" | docker login -u iamapikey --password-stdin ${{ env.ICR_REGISTRY }}

      - name: Ensure ICR namespace exists
        run: |
          OUTPUT=$(ibmcloud cr namespace-add ${{ env.ICR_NAMESPACE }} 2>&1) || true
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qi "already exists"; then
            echo "Namespace '${{ env.ICR_NAMESPACE }}' already exists, continuing."
          elif echo "$OUTPUT" | grep -qiE "created|OK"; then
            echo "Namespace '${{ env.ICR_NAMESPACE }}' created."
          else
            echo "::error::Could not create/verify ICR namespace '${{ env.ICR_NAMESPACE }}'. This usually means IBM_CLOUD_API_KEY lacks a Container Registry IAM role (needs at least Writer, scoped to all resource groups or the one this namespace belongs to). Fix in the IBM Cloud console under Manage > Access (IAM), then re-run."
            exit 1
          fi
          echo "Namespaces visible to this API key:"
          ibmcloud cr namespace-list

      - name: Configure kubectl for the IKS cluster
        run: |
          ibmcloud ks cluster config --cluster "${{ env.IKS_CLUSTER_ID }}"
          echo "Current kubectl context:"
          kubectl config current-context

      - name: Build & push observability-server
        working-directory: microservices/observability-server
        run: |
          mvn clean package
          docker build --no-cache -t ${{ env.ICR_REGISTRY }}/${{ env.ICR_NAMESPACE }}/observability-server:${{ env.IMAGE_TAG }} .
          docker push ${{ env.ICR_REGISTRY }}/${{ env.ICR_NAMESPACE }}/observability-server:${{ env.IMAGE_TAG }}

      - name: Build & push observability-debug-agent
        working-directory: microservices/observability-debug-agent
        run: |
          docker build --no-cache -t ${{ env.ICR_REGISTRY }}/${{ env.ICR_NAMESPACE }}/observability-debug-agent:${{ env.IMAGE_TAG }} .
          docker push ${{ env.ICR_REGISTRY }}/${{ env.ICR_NAMESPACE }}/observability-debug-agent:${{ env.IMAGE_TAG }}

      - name: Build & push product
        working-directory: microservices/product
        run: |
          mvn clean package
          docker build --no-cache -t ${{ env.ICR_REGISTRY }}/${{ env.ICR_NAMESPACE }}/product:${{ env.IMAGE_TAG }} .
          docker push ${{ env.ICR_REGISTRY }}/${{ env.ICR_NAMESPACE }}/product:${{ env.IMAGE_TAG }}

      - name: Build & push images
        working-directory: microservices/images
        run: |
          mvn clean package
          docker build --no-cache -t ${{ env.ICR_REGISTRY }}/${{ env.ICR_NAMESPACE }}/images:${{ env.IMAGE_TAG }} .
          docker push ${{ env.ICR_REGISTRY }}/${{ env.ICR_NAMESPACE }}/images:${{ env.IMAGE_TAG }}

      - name: Build & push ecommerce
        working-directory: microservices/ecommerce
        run: |
          mvn clean package
          docker build --no-cache -t ${{ env.ICR_REGISTRY }}/${{ env.ICR_NAMESPACE }}/ecommerce:${{ env.IMAGE_TAG }} .
          docker push ${{ env.ICR_REGISTRY }}/${{ env.ICR_NAMESPACE }}/ecommerce:${{ env.IMAGE_TAG }}

      - name: Apply namespaces
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/observability/namespace.yaml

      - name: Apply application manifests
        run: |
          kubectl apply -f k8s/product
          kubectl apply -f k8s/images
          kubectl apply -f k8s/ecommerce

      - name: Apply observability stack manifests
        run: |
          kubectl apply -f k8s/observability/prometheus
          kubectl apply -f k8s/observability/loki
          kubectl apply -f k8s/observability/promtail
          kubectl apply -f k8s/observability/grafana
          kubectl apply -f k8s/observability-server
          kubectl apply -f k8s/observability-debug-agent/configmap.yaml
          kubectl apply -f k8s/observability-debug-agent/deployment.yaml
          kubectl apply -f k8s/observability-debug-agent/service.yaml

      - name: Set image and force rollout
        run: |
          REG="${{ env.ICR_REGISTRY }}/${{ env.ICR_NAMESPACE }}"
          TAG="${{ env.IMAGE_TAG }}"
          kubectl set image deployment/product product=$REG/product:$TAG -n ecommerce
          kubectl set image deployment/images images=$REG/images:$TAG -n ecommerce
          kubectl set image deployment/ecommerce ecommerce=$REG/ecommerce:$TAG -n ecommerce
          kubectl set image deployment/observability-server observability-server=$REG/observability-server:$TAG -n observability
          kubectl set image deployment/observability-debug-agent observability-debug-agent=$REG/observability-debug-agent:$TAG -n observability
          # The tag is always ":latest", so `kubectl set image` above is a
          # no-op once the field already points at that exact string - it
          # will NOT pull freshly-pushed content on its own. Force every
          # pod to restart and re-pull.
          kubectl rollout restart deployment/product -n ecommerce
          kubectl rollout restart deployment/images -n ecommerce
          kubectl rollout restart deployment/ecommerce -n ecommerce
          kubectl rollout restart deployment/observability-server -n observability
          kubectl rollout restart deployment/observability-debug-agent -n observability

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/product -n ecommerce --timeout=300s
          kubectl rollout status deployment/images -n ecommerce --timeout=300s
          kubectl rollout status deployment/ecommerce -n ecommerce --timeout=300s
          kubectl rollout status deployment/prometheus -n observability --timeout=300s
          kubectl rollout status deployment/loki -n observability --timeout=300s
          kubectl rollout status deployment/grafana -n observability --timeout=300s
          kubectl rollout status deployment/observability-server -n observability --timeout=300s
          kubectl rollout status deployment/observability-debug-agent -n observability --timeout=300s

      - name: Summary
        if: always()
        run: |
          {
            echo "## IBM Cloud (ICR) deployment"
            echo ""
            echo "Image tag: \`${{ env.IMAGE_TAG }}\`"
            echo "Registry: \`${{ env.ICR_REGISTRY }}/${{ env.ICR_NAMESPACE }}\`"
            echo ""
            echo "### Pods (ecommerce)"
            echo '```'
            kubectl get pods -n ecommerce
            echo '```'
            echo "### Pods (observability)"
            echo '```'
            kubectl get pods -n observability
            echo '```'
            echo "### Services (ecommerce) - see EXTERNAL-IP for public access"
            echo '```'
            kubectl get svc -n ecommerce
            echo '```'
            echo "### Services (observability) - see EXTERNAL-IP for public access"
            echo '```'
            kubectl get svc -n observability
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
